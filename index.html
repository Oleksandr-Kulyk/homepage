<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <div class="header__container container">
        <div class="header__brand">
          <div class="header__logo">
            <svg
              class="header__logo-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>

          <div class="header__meta">
            <div class="header__status">
              <span class="header__status-dot"></span>
              <span class="header__status-text">SYSTEM ONLINE</span>
            </div>

            <h1 class="header__name">OLEKSANDR KULYK</h1>
            <span class="header__role">FULLSTACK ENGINEER</span>
          </div>
        </div>

        <div class="header__actions">
          <nav class="header__nav">
            <a href="#intro" class="header__link header__link--active">HOME</a>
            <a href="#contacts" class="header__link">CONTACTS</a>
            <a href="#timeline" class="header__link">TIMELINE</a>
            <a href="#profile" class="header__link">PROFILE</a>
          </nav>

          <button class="header__utility-btn" aria-label="System Menu">
            <span class="header__utility-dot"></span>
            <span class="header__utility-dot"></span>
            <span class="header__utility-dot"></span>
            <span class="header__utility-dot"></span>
          </button>
        </div>
      </div>
      <main id="content-container" class="content-container">
        <section class="content-section" id="intro"></section>
        <section class="content-section" id="contacts"></section>
        <section class="content-section" id="timeline"></section>
        <section class="content-section" id="profile"></section>
      </main>
    </header>
    <footer class="footer">
      <div class="footer__container container">
        <div class="footer__info">
          <small class="footer__copyright">© 2026 OLEKSANDR KULYK</small>
          <span class="footer__build">v1.0.0-beta // SHIFT_SPA</span>
        </div>
        <div class="footer__status">
          <span class="footer__terminal-line">ENV: PRODUCTION</span>
          <span class="footer__divider">|</span>
          <span class="footer__terminal-line">LOC: 50.59° N, 32.39° E</span>
        </div>
      </div>
    </footer>
  </body>
</html>
